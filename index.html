<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuildSchool Character System</title>
<script>/* theme and font size from Other -> Settings (js/modals.js), applied before the page draws */
try { var gsT = localStorage.getItem('gs_theme'), gsF = parseFloat(localStorage.getItem('gs_font_scale'));
  if (gsT) document.documentElement.dataset.theme = gsT;
  if (gsF) document.documentElement.style.setProperty('--fs', String(gsF)); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&family=Cinzel:wght@500;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=2026-11-08.32">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div id="auth-gate" style="position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="background:var(--panel);border:1px solid var(--border);padding:24px 28px;width:320px;max-width:90vw;">
    <h2 style="font-size:calc(16px * var(--fs));margin-bottom:16px;color:var(--text-bright);text-transform:uppercase;letter-spacing:1px;">GuildSchool</h2>
    <div id="auth-error" style="color:var(--red-b);font-size:calc(12px * var(--fs));margin-bottom:8px;display:none"></div>
    <label style="display:block;font-size:calc(11px * var(--fs));color:var(--text-dim);margin-bottom:2px">Email</label>
    <input class="w-full" id="auth-email" type="email" style="padding:6px 8px;margin-bottom:10px;background:var(--input-bg);border:1px solid var(--border);font-family:inherit;color:var(--text)" autocomplete="username">
    <label style="display:block;font-size:calc(11px * var(--fs));color:var(--text-dim);margin-bottom:2px">Password</label>
    <input class="w-full" id="auth-password" type="password" style="padding:6px 8px;margin-bottom:14px;background:var(--input-bg);border:1px solid var(--border);font-family:inherit;color:var(--text)" autocomplete="current-password">
    <div style="display:flex;gap:8px">
      <button onclick="handleSignIn()" style="flex:1;padding:6px;background:var(--panel);border:1px solid var(--border);cursor:pointer">Sign In</button>
      <button onclick="handleSignUp()" style="flex:1;padding:6px;background:var(--panel);border:1px solid var(--border);cursor:pointer">Sign Up</button>
    </div>
    <div style="margin-top:10px;font-size:calc(11px * var(--fs));text-align:right"><a href="#" onclick="handleForgotPassword();return false" style="color:var(--text-dim)">Forgot password?</a></div>
    <div id="auth-status" style="font-size:calc(11px * var(--fs));color:var(--text-dim);margin-top:10px"></div>
  </div>
</div>

<div id="reset-gate" style="position:fixed;inset:0;background:var(--bg);z-index:10000;display:none;align-items:center;justify-content:center;">
  <div style="background:var(--panel);border:1px solid var(--border);padding:24px 28px;width:320px;max-width:90vw;">
    <h2 style="font-size:calc(16px * var(--fs));margin-bottom:16px;color:var(--text-bright);text-transform:uppercase;letter-spacing:1px;">Set a New Password</h2>
    <div id="reset-error" style="color:var(--red-b);font-size:calc(12px * var(--fs));margin-bottom:8px;display:none"></div>
    <label style="display:block;font-size:calc(11px * var(--fs));color:var(--text-dim);margin-bottom:2px">New password</label>
    <input class="w-full" id="reset-password" type="password" style="padding:6px 8px;margin-bottom:10px;background:var(--input-bg);border:1px solid var(--border);font-family:inherit;color:var(--text)" autocomplete="new-password">
    <label style="display:block;font-size:calc(11px * var(--fs));color:var(--text-dim);margin-bottom:2px">Confirm new password</label>
    <input class="w-full" id="reset-password-confirm" type="password" style="padding:6px 8px;margin-bottom:14px;background:var(--input-bg);border:1px solid var(--border);font-family:inherit;color:var(--text)" autocomplete="new-password" onkeydown="if(event.key==='Enter')handleSetNewPassword()">
    <div style="display:flex;gap:8px">
      <button onclick="handleSetNewPassword()" style="flex:1;padding:6px;background:var(--panel);border:1px solid var(--border);cursor:pointer">Set Password</button>
      <button onclick="handleSignOut()" style="flex:1;padding:6px;background:var(--panel);border:1px solid var(--border);cursor:pointer">Sign Out</button>
    </div>
  </div>
</div>

<div id="pending-gate" style="position:fixed;inset:0;background:var(--bg);z-index:9998;display:none;align-items:center;justify-content:center;">
  <div style="background:var(--panel);border:1px solid var(--border);padding:24px 28px;width:340px;max-width:90vw;text-align:center">
    <h2 style="font-size:calc(16px * var(--fs));margin-bottom:12px;color:var(--text-bright);text-transform:uppercase;letter-spacing:1px;">Pending Approval</h2>
    <p style="font-size:calc(13px * var(--fs));color:var(--text-dim);margin-bottom:16px">Your account has been created but hasn't been approved yet. Check back once the GM/admin has approved your access.</p>
    <button onclick="handleSignOut()">Sign Out</button>
  </div>
</div>

<div id="topbar">
  <div class="topbar-row">
    <img class="banner-logo" src="assets/img/logo.png" alt="Celtricia">
    <h1>GuildSchool</h1>
    <div class="sep"></div>
    <span id="auth-user-label" style="font-size:calc(11px * var(--fs));color:var(--header-text)"></span>
    <button onclick="handleSignOut()">Sign Out</button>
  </div>
  <div class="topbar-row topbar-menus">
    <div class="top-menu" data-menu="file">
      <button class="top-menu-btn" onclick="toggleTopMenu('file', event)">File ▾</button>
      <div class="top-menu-panel">
        <button onclick="closeTopMenus();printCharacterSheet()"><span class="menu-icon">🖨</span>Print Sheet</button>
        <button onclick="closeTopMenus();exportData()"><span class="menu-icon">📤</span>Export JSON</button>
        <button onclick="closeTopMenus();importData()"><span class="menu-icon">📥</span>Import JSON</button>
        <hr>
        <button onclick="closeTopMenus();showUtilitiesModule()"><span class="menu-icon">🔧</span>Utilities</button>
        <button onclick="closeTopMenus();showGroupModule('all')"><span class="menu-icon">👥</span>Groups</button>
        <button onclick="closeTopMenus();openCreateGroupModal()"><span class="menu-icon">➕</span>New Group</button>
        <div id="file-menu-combats"></div>
      </div>
    </div>
    <div class="top-menu" data-menu="character">
      <button class="top-menu-btn" onclick="toggleTopMenu('character', event)">Character ▾</button>
      <div class="top-menu-panel">
        <button onclick="closeTopMenus();openNewCharModal()">Create Character</button>
        <button onclick="closeTopMenus();deleteChar()">Delete Character</button>
        <button disabled title="Not working yet; see KnownIssues.md">Transfer Ownership</button>
        <hr>
        <button onclick="closeTopMenus();populateAllMissingDropdowns()" title="Adds any dropdown-only sub-skills the character's trained skills are missing">Populate Missing Dropdown Skills</button>
      </div>
    </div>
    <div class="top-menu" data-menu="other">
      <button class="top-menu-btn" onclick="toggleTopMenu('other', event)">Other <span id="other-menu-badge" class="chat-badge" style="display:none"></span> ▾</button>
      <div class="top-menu-panel">
        <button onclick="closeTopMenus();showChatModule()"><span class="menu-icon">💬</span>Chat <span id="chat-menu-badge" class="chat-badge" style="display:none"></span></button>
        <button onclick="closeTopMenus();showBestiaryModule()"><span class="menu-icon">🐉</span>Bestiary</button>
        <button onclick="closeTopMenus();showScheduleModule()"><span class="menu-icon">📅</span>Game Schedule</button>
        <button id="admin-panel-btn" onclick="closeTopMenus();openAdminPanel()" style="display:none"><span class="menu-icon">🛡</span>Admin</button>
        <button onclick="closeTopMenus();openSettingsModal()"><span class="menu-icon">⚙</span>Settings</button>
        <button onclick="closeTopMenus();openAboutModal()"><span class="menu-icon">ℹ</span>About</button>
      </div>
    </div>
    <div class="sep"></div>
    <select id="char-select" onchange="selectChar(this.value)"><option value="">— select character —</option></select>
    <select id="char-sort" onchange="state.charSortMode=this.value;saveState();renderCharSelect()" style="font-size:calc(11px * var(--fs))">
      <option value="name">Sort: Name</option>
      <option value="group">Sort: Group</option>
      <option value="locale">Sort: Locale</option>
    </select>
  </div>
</div>

<div id="layout">
  <div id="sidebar"><div class="note placeholder">Select or create a character</div></div>
  <div id="sidebar-grip" title="Drag to resize the sidebar (double-click to reset)"></div>
  <div id="main"><div class="note placeholder">Select a character to begin</div></div>
</div>

<div id="print-view" style="display:none"></div>

<!-- popups close only from their own buttons, not by clicking outside them -->
<div id="modal-overlay">
  <div id="modal-box"></div>
</div>

<!-- Cache-busting version, also used for data/*.json (js/data.js reads it).
     Whenever anything in css/, js/ or data/ changes, bump ?v= on the
     stylesheet link and on every script tag below, all to the same new
     value, so browsers fetch the new files instead of cached copies. -->
<script src="js/auth.js?v=2026-11-08.32"></script>
<script src="js/data.js?v=2026-11-08.32"></script>
<script src="js/state.js?v=2026-11-08.32"></script>
<script src="js/formulas.js?v=2026-11-08.32"></script>
<script src="js/render.js?v=2026-11-08.32"></script>
<script src="js/bestiary.js?v=2026-11-08.32"></script>
<script src="js/groups.js?v=2026-11-08.32"></script>
<script src="js/schedule.js?v=2026-11-08.32"></script>
<script src="js/combat.js?v=2026-11-08.32"></script>
<script src="js/goesi.js?v=2026-11-08.32"></script>
<script src="js/group-add-member.js?v=2026-11-08.32"></script>
<script src="js/dice.js?v=2026-11-08.32"></script>
<script src="js/chat.js?v=2026-11-08.32"></script>
<script src="js/attack.js?v=2026-11-08.32"></script>
<script src="js/character-views.js?v=2026-11-08.32"></script>
<script src="js/modals.js?v=2026-11-08.32"></script>
<script src="js/mutations.js?v=2026-11-08.32"></script>
<script src="js/import-export.js?v=2026-11-08.32"></script>
<script src="js/init.js?v=2026-11-08.32"></script>
</body>
</html>
